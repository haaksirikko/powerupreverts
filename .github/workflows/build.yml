name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SM_VERSION: "1.12"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SourceMod
        run: |
          wget -q -O sourcemod.tar.gz "https://www.sourcemod.net/latest.php?os=linux&version=$SM_VERSION"
          mkdir sourcemod
          tar xf sourcemod.tar.gz -C sourcemod
          cd sourcemod/addons/sourcemod/scripting
          mv spcomp* ../../../../scripting
          mkdir -p ../../../../scripting/include
          mv include/*.inc ../../../../scripting/include

      # Tagged builds report the tag in `sm plugins list` instead of the in-tree
      # PLUGIN_VERSION. Untagged builds are compile checks only, so they keep it.
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^#define PLUGIN_VERSION \".*\"/#define PLUGIN_VERSION \"${GITHUB_REF_NAME#v}\"/" scripting/powerupreverts.sp
          grep '^#define PLUGIN_VERSION' scripting/powerupreverts.sp

      - name: Compile
        run: |
          mkdir -p dist/addons/sourcemod/plugins dist/addons/sourcemod/gamedata
          ./scripting/spcomp64 -i scripting/include -o dist/addons/sourcemod/plugins/powerupreverts.smx scripting/powerupreverts.sp
          cp gamedata/powerupreverts.txt dist/addons/sourcemod/gamedata/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: powerupreverts
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: powerupreverts
          path: dist

      - name: Package
        run: |
          cd dist
          zip -qr ../powerupreverts.zip addons
          unzip -l ../powerupreverts.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: powerupreverts.zip
          generate_release_notes: true
