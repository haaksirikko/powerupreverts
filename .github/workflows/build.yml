name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGIN: powerupreverts

jobs:
  build:
    name: Build (SourceMod ${{ matrix.sm-target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.12 is the oldest supported SourceMod and the build that gets released.
        # 1.13 is a forward-compatibility check: newer includes and compiler.
        sm-target: ["1.12", "1.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup SourceMod
        run: |
          wget -q -O sourcemod.tar.gz "https://www.sourcemod.net/latest.php?os=linux&version=${{ matrix.sm-target }}"
          mkdir sourcemod
          tar xf sourcemod.tar.gz -C sourcemod
          cd sourcemod/addons/sourcemod/scripting
          mv spcomp* ../../../../scripting
          mkdir -p ../../../../scripting/include
          mv include/*.inc ../../../../scripting/include

      # Tagged builds report the tag in `sm plugins list` instead of the in-tree
      # PLUGIN_VERSION. Untagged builds are compile checks only, so they keep it.
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^#define PLUGIN_VERSION \".*\"/#define PLUGIN_VERSION \"${GITHUB_REF_NAME#v}\"/" scripting/$PLUGIN.sp
          grep '^#define PLUGIN_VERSION' scripting/$PLUGIN.sp

      - name: Compile
        run: |
          mkdir -p dist/addons/sourcemod/plugins dist/addons/sourcemod/gamedata
          ./scripting/spcomp64 -i scripting/include -o dist/addons/sourcemod/plugins/$PLUGIN.smx scripting/$PLUGIN.sp
          cp gamedata/$PLUGIN.txt dist/addons/sourcemod/gamedata/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: $PLUGIN-sm${{ matrix.sm-target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: $PLUGIN-sm1.12
          path: dist

      - name: Package
        run: |
          cd dist
          zip -qr "../$PLUGIN-${GITHUB_REF_NAME}.zip" addons
          unzip -l "../$PLUGIN-${GITHUB_REF_NAME}.zip"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN }}-${{ github.ref_name }}.zip
          generate_release_notes: true
