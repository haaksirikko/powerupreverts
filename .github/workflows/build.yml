name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow on tags so the artifact always comes from
  # the same build that gets published.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SM_VERSION: "1.12"

jobs:
  build:
    name: Build (SM ${{ matrix.sm-target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 1.12 is the only supported target. The matrix is kept as-is so a
        # 1.13 leg can be re-added without touching anything else.
        sm-target: ["1.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup SourceMod
        run: |
          wget -O sourcemod.tar.gz "https://www.sourcemod.net/latest.php?os=linux&version=${{ matrix.sm-target }}"
          mkdir sourcemod
          tar xf sourcemod.tar.gz -C sourcemod
          cd sourcemod/addons/sourcemod/scripting
          mv spcomp* ../../../../scripting
          mkdir -p ../../../../scripting/include
          mv include/*.inc ../../../../scripting/include

      # Tagged builds report the tag in `sm plugins list` instead of the in-tree
      # PLUGIN_VERSION. Untagged builds are compile checks only, so they keep it.
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^#define PLUGIN_VERSION \".*\"/#define PLUGIN_VERSION \"${GITHUB_REF_NAME#v}\"/" scripting/powerupreverts.sp
          grep '^#define PLUGIN_VERSION' scripting/powerupreverts.sp

      - name: Build plugin
        run: |
          mkdir -p dist/addons/sourcemod/plugins dist/addons/sourcemod/gamedata
          ./scripting/spcomp64 -i scripting/include -o dist/addons/sourcemod/plugins/powerupreverts.smx scripting/powerupreverts.sp
          cp gamedata/powerupreverts.txt dist/addons/sourcemod/gamedata/

      # GitHub appends .zip to the artifact name, so this downloads as
      # powerupreverts.zip with addons/ at its root.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: powerupreverts
          path: dist/
          retention-days: 90
          if-no-files-found: error
